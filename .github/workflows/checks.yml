name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  content-guards:
    name: İçerik ve uyum denetimleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # mocore hattı MediaPipe yüzünden 3.12'ye sabit (3.13/3.14 wheel yok).
          # Bu iş yalnız stdlib kullanıyor ama sürümü aynı tutuyoruz.
          python-version: "3.12"

      - name: Config JSON geçerliliği + şema sürümü
        # Sürümsüz config sessizce yorumlanır; yorumlayıcı sürüm uyumsuzluğunda
        # patlamalı, tahmin etmemeli.
        run: python3 tools/config_check.py

      - name: Faz config değişmezleri
        # Timeout'suz bir faz, çıkış koşulunu kaçırdığında sonsuza park eder ve
        # bu dışarıdan "kullanıcı hareketsiz" gibi görünür — çekirdeğin kendi
        # uyarısı. Denetim: terminal faz · timeout · ölçüm fazı · abortCode ·
        # metrik referansları · koşul dilbilgisi · batarya kapsamı.
        run: python3 tools/phase_check.py

      - name: Triyaj landmark sarti bayat mi
        # Kadrajda hangi landmark'larin aranacagi HAREKETE gore degisir ve
        # metrik config'inden turetilir. Elle yazilan liste bayatlar, bayat
        # liste sessizce yanlis reddeder: sabit "tam govde" sarti bir OMUZ
        # testinin (overhead_reach) adaylarinin 8'de 7'sini eledi - gercek
        # veride olculdu, kalca orani 0.75-1.00 iken ayak bilegi 0.00'di.
        # Bu adim ayrica bataryanin andigi HER adin (metrik ya da
        # derivedMeasures) beyan edilmis olmasini zorlar.
        run: python3 tools/triage_landmarks.py

      - name: Wellness dil süzgeci
        # Tek bir aşırı ifade ürünü tıbbi cihaz sınırına iter (FDA General
        # Wellness / Apple 1.4.1). Süzgeç hiç dosya bulamazsa çıkış kodu 2 verir
        # ve iş yine kırılır — "hiçbir şey taramadım" bir geçiş değildir.
        run: python3 tools/wellness_lint.py

      - name: Süzgecin kendisi çalışıyor mu (negatif test)
        # Bulmayan bir denetim ile bozuk bir denetim dışarıdan aynı görünür.
        run: python3 tools/lint_selftest.py

  flutter-checks:
    name: Flutter analyze + test + Android release build (L-348/LIS-P0-002)
    # Bu iş 2026-08-18'e kadar hiç yoktu — repo yalnız içerik/uyum
    # denetimleri koşuyordu, `flutter analyze`/`flutter test`/gerçek build
    # YOKTU (roadmap baseline'ında adıyla kayıtlı). Bu satırlar öncesinde
    # `flutter analyze`in 4 pre-existing sorunu 5015 satırlık DEFTER'de
    # HİÇ görünmüyordu — kapı olmayan bir şey kırık olsa da fark edilmez.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Poz modeli (pinli SHA-256 doğrulamalı)
        run: tool/fetch_pose_model.sh

      - name: Yazı tipleri (pinli SHA-256 doğrulamalı, L-348)
        # `google_fonts` artık runtime'da indirmiyor (main.dart
        # allowRuntimeFetching=false) — bu iki dosya olmadan CI'daki
        # flutter test/build native metin render edemez.
        run: tool/fetch_fonts.sh

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: app test süiti
        run: flutter test

      - name: lissom_engine test süiti
        run: (cd packages/lissom_engine && flutter test)

      - name: Android release build — kod yolu kanıtı, İMZALI YAYIN DEĞİL
        # Gerçek keystore kurucuda (`~/.secrets/yula/`), CI'da YOK.
        # `-PallowDebugSigning` L-286'nın KENDİ kaçış kapısı (build.gradle.
        # kts) — CI'a özgü bir icat değil, "bilerek imzasız yerel build"
        # için zaten var olan bayrak. Bu adım release KOD YOLUNUN
        # derlendiğini kanıtlar; Play'e yüklenebilir bir artefakt ÜRETMEZ.
        run: flutter build appbundle --release -PallowDebugSigning=true

  ios-build:
    name: iOS release build, no-codesign (L-348/LIS-P0-002)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Poz modeli (pinli SHA-256 doğrulamalı)
        run: tool/fetch_pose_model.sh

      - name: Yazı tipleri (pinli SHA-256 doğrulamalı, L-348)
        run: tool/fetch_fonts.sh

      - run: flutter pub get

      - name: iOS release build, imzasız
        # `--no-codesign`: CI runner'ında imzalama sertifikası yok ve
        # olmamalı (sertifika hesap-sahibi kalemidir). Bu adım release
        # derleme yolunun GERÇEKTEN derlendiğini kanıtlar.
        run: flutter build ios --release --no-codesign
