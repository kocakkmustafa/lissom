name: lissom
description: Lissom — movement-health assessment. Camera-based, on device.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # All shared Motion packages use the same reviewed, immutable Git revision.
  motion_account:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_account
      ref: f2ea161c7e974d57b114ba7773836c72be17a381

  # Motor AYRI bir paket ve Flutter'a HİÇ bağımlı değil (M-F-160, JabLab
  # ayrımının aynısı): ölçüm/skorlama mantığı bir widget ağacı olmadan
  # test edilebilir kalmalı, kabuk da ona yandan uzanamamalı.
  lissom_engine:
    path: packages/lissom_engine

  # Terfi edilmiş aile kalıcılık şeması (SessionStore/SessionRecord, M-F-193).
  # Motorla AYNI tag'e pinli olmak ZORUNDA: aynı paketin iki farklı ref'i
  # çözümlenemez, ve sürüm ayrışması "kaydettiğim şema ile okuduğum şema
  # farklı" sınıfını doğurur.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: f2ea161c7e974d57b114ba7773836c72be17a381

  # Kamera → PoseSource. Motorla AYNI 40-SHA'dan, TEK pin (J-071).
  #
  # ⚠️ TAM-40-SHA yazılıyor, kısa SHA ya da tag adı DEĞİL: pub `ref:` değerini
  # METİN olarak karşılaştırır, commit olarak değil (Choreia ölçtü, M-F-265).
  # Aynı commit'i iki farklı yazımla (tag adı + kısa SHA) bildirmek pub'a
  # İKİ AYRI KAYNAK gibi görünür ve `motion_core` iki kez çözülmeye çalışılır.
  #
  # Ek olarak ölçüldü: `motion_camera`'nın KENDİ `motion_core` bağımlılığı
  # `path: ../motion_core` (tam-SHA DEĞİL). Bu bizim için daha
  # güçlü — aynı url+ref tek git checkout'una çözüldüğü için kameranın
  # gördüğü çekirdek ile bizim gördüğümüz ÇEKİRDEK AYNI dosyalar oluyor.
  # Pin-eşitliği testi bunu kilitten doğrular (varsayım değil).
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_camera
      ref: f2ea161c7e974d57b114ba7773836c72be17a381

  # Yalnız uygulama-özel dizini bulmak için. Depo BİÇİMİ çekirdekte
  # (append-only JSONL); kurucusu `File` alıyor, çünkü path_provider
  # ÇAĞIRANA ait (Gravita'nın terfi koşulu #1) — böylece depo saf Dart
  # kalıyor ve testler geçici bir dosyayla koşabiliyor.
  path_provider: ^2.1.0

  # Tasarım paneli tipografisi (Newsreader/Nunito Sans/IBM Plex Mono) — aynı
  # paket Choreia ve Ostinato'da da kullanılıyor (aile emsali).
  google_fonts: ^6.2.1

  # Kamera izni isteği (CameraPoseSource, 2026-08-12) — Ostinato'nun
  # camera_session.dart deseninin aynısı. İzin API'sidir, ağa ÇIKMAZ —
  # tools/network_dependency_check.py'nin NETWORK_DEP_HINTS'i bu paket
  # ailesini taramıyor (koordinatörün öngörüsü test edildi: kapı ATEŞLENMEDİ,
  # çünkü `permission_handler` hiçbir ağ-paketi-ailesi önekiyle eşleşmiyor —
  # tahmin değil, ölçüldü).
  permission_handler: ^11.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

  # `reference_equivalence_test.dart`in kanıt-zinciri doğrulaması: kod
  # durumunu bağlayan içerik-hash'i `tools/l031_space_divergence.py`nin
  # ürettiğiyle AYNI algoritmayla (SHA-256, ham baytlar) yeniden hesaplar
  # (2026-08-12, M-F-462/474 — zaten `crypto: 3.0.7` transitive çözülüyordu,
  # doğrudan bağımlılık olarak açık yazıldı).
  crypto: ^3.0.6

flutter:
  uses-material-design: true
  assets:
    # Test tanımları, eşikler ve bantlar RUNTIME'da okunan versiyonlu
    # config'tir (CLAUDE.md sert kuralı: "kural = versiyonlu config").
    # Yeni bir ROM testi eklemek kod değil KAYIT ister.
    - config/tests/
    - config/metrics/
    - config/phases/
    - config/ia/
    - config/courses/

    # ⚠️ POZ MODELİ — `motion_camera` modeli **KASITLI taşımıyor**:
    # "the plugin deliberately bundles no model (apps pin their own and ship
    #  it as an asset)". Model yoksa kamera **hiç başlamaz** (L-274).
    #
    # ⚠️ Ve `.task` dosyası git'te DEĞİL (aile kuralı: 9,4 MB'lık ikili her
    # klonda taşınmaz). Pin URL+SHA olarak yaşıyor ve doğrulama bir BUILD
    # KAPISI: `tool/fetch_pose_model.sh`.
    #
    # 🪤 **Yorum bloğu listeyi KESMEZ** — bu satırların ARDINDAN gelen giriş
    # de okunur; koordinatörün andığı "yorum bloğunun listeyi kesme tuzağı"na
    # karşı burada kasten liste SONUNA konmadı.
    - assets/models/

    # L-348/LIS-P0-002: `google_fonts`un RUNTIME'da indirdiği iki aileyi
    # build-time'a taşır (`lib/main.dart` `GoogleFonts.config.
    # allowRuntimeFetching = false` ile eşleşir). Paketin KENDİ resmi
    # self-host sözleşmesi (google_fonts README §"Bundling fonts when
    # releasing"): dosyalar `fonts:` bloğunda DEĞİL, düz `assets:` klasör
    # girdisi olarak listelenir — paket kendi iç `FontLoader`ıyla asset
    # manifestini TARAR, adları Google Fonts API'nin KENDİ dosya-adı
    # sözleşmesiyle (`{Aile}-{Ağırlık}.ttf`, `FontWeight.w600` → `SemiBold`)
    # eşleştirir. Yalnız GERÇEKTEN kullanılan ağırlıklar: Newsreader w300
    # (`display()` varsayılanı) + w400 (`headlineMedium`/`headlineSmall`);
    # Nunito Sans w400 (`sans.bodyLarge/Medium/Small`, Material3
    # varsayılanı) + w600 (`titleLarge/Medium/Small`, `label()`, hepsi AÇIK
    # override — `lib/app/lissom_theme.dart` içinde grep'lenebilir). Dosya
    # ADLARI YENİDEN ADLANDIRILMAZ (README'nin kendi uyarısı). Dosyalar
    # `tool/fetch_fonts.sh` ile pinli SHA-256 doğrulamasıyla iner, git'e
    # commit EDİLMEZ (`assets/models/*.task` ile aynı desen).
    - assets/fonts/
