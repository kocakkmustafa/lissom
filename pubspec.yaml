name: lissom
description: Lissom — movement-health assessment. Camera-based, on device.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Motor AYRI bir paket ve Flutter'a HİÇ bağımlı değil (M-F-160, JabLab
  # ayrımının aynısı): ölçüm/skorlama mantığı bir widget ağacı olmadan
  # test edilebilir kalmalı, kabuk da ona yandan uzanamamalı.
  lissom_engine:
    path: packages/lissom_engine

  # Terfi edilmiş aile kalıcılık şeması (SessionStore/SessionRecord, M-F-193).
  # Motorla AYNI tag'e pinli olmak ZORUNDA: aynı paketin iki farklı ref'i
  # çözümlenemez, ve sürüm ayrışması "kaydettiğim şema ile okuduğum şema
  # farklı" sınıfını doğurur.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d

  # Kamera → PoseSource. Motorla AYNI 40-SHA'dan, TEK pin (J-071).
  #
  # ⚠️ TAM-40-SHA yazılıyor, kısa SHA ya da tag adı DEĞİL: pub `ref:` değerini
  # METİN olarak karşılaştırır, commit olarak değil (Choreia ölçtü, M-F-265).
  # Aynı commit'i iki farklı yazımla (tag adı + kısa SHA) bildirmek pub'a
  # İKİ AYRI KAYNAK gibi görünür ve `motion_core` iki kez çözülmeye çalışılır.
  #
  # Ek olarak ölçüldü: `motion_camera`'nın KENDİ `motion_core` bağımlılığı
  # `f13bdc9`'te `path: ../motion_core` (tam-SHA DEĞİL). Bu bizim için daha
  # güçlü — aynı url+ref tek git checkout'una çözüldüğü için kameranın
  # gördüğü çekirdek ile bizim gördüğümüz ÇEKİRDEK AYNI dosyalar oluyor.
  # Pin-eşitliği testi bunu kilitten doğrular (varsayım değil).
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_camera
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d

  # Yalnız uygulama-özel dizini bulmak için. Depo BİÇİMİ çekirdekte
  # (append-only JSONL); kurucusu `File` alıyor, çünkü path_provider
  # ÇAĞIRANA ait (Gravita'nın terfi koşulu #1) — böylece depo saf Dart
  # kalıyor ve testler geçici bir dosyayla koşabiliyor.
  path_provider: ^2.1.0

  # Tasarım paneli tipografisi (Newsreader/Nunito Sans/IBM Plex Mono) — aynı
  # paket Choreia ve Ostinato'da da kullanılıyor (aile emsali).
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Test tanımları, eşikler ve bantlar RUNTIME'da okunan versiyonlu
    # config'tir (CLAUDE.md sert kuralı: "kural = versiyonlu config").
    # Yeni bir ROM testi eklemek kod değil KAYIT ister.
    - config/tests/
    - config/metrics/
    - config/phases/
    - config/ia/

    # ⚠️ POZ MODELİ — `motion_camera` modeli **KASITLI taşımıyor**:
    # "the plugin deliberately bundles no model (apps pin their own and ship
    #  it as an asset)". Model yoksa kamera **hiç başlamaz** (L-274).
    #
    # ⚠️ Ve `.task` dosyası git'te DEĞİL (aile kuralı: 9,4 MB'lık ikili her
    # klonda taşınmaz). Pin URL+SHA olarak yaşıyor ve doğrulama bir BUILD
    # KAPISI: `tool/fetch_pose_model.sh`.
    #
    # 🪤 **Yorum bloğu listeyi KESMEZ** — bu satırların ARDINDAN gelen giriş
    # de okunur; koordinatörün andığı "yorum bloğunun listeyi kesme tuzağı"na
    # karşı burada kasten liste SONUNA konmadı.
    - assets/models/
